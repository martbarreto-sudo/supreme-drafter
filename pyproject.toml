[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-hunter"
version = "0.1.0"
description = "Deep Hunter (auditor forense) × Supreme Drafter (redator) — auditoria de prova digital."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.116.0", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deep-hunter = "deep_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["deep_hunter*", "schema*", "core*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
